# Windows 배포 패키지를 실제 Windows에서 만들고, 사용자처럼 압축을 풀어 켜서 확인한다.
# - 수동 실행/커밋: Actions 페이지의 Artifacts에서 caption-stream-windows 를 받는다
# - GitHub 웹에서 릴리스를 Publish하면: 그 릴리스에 caption-stream-windows.zip 을 붙인다
name: Windows package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -w server
      # 중계 서버 주소: 저장소 변수 RELAY_URL > Cloudflare 계정의 workers.dev 주소 > 없음(와이파이 전용)
      - name: Resolve relay URL
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELAY_URL_VAR: ${{ vars.RELAY_URL }}
        run: |
          url="$RELAY_URL_VAR"
          if [ -z "$url" ] && [ -n "$CF_TOKEN" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).result.subdomain||'')}catch{}})") || true
            if [ -n "$sub" ]; then url="https://caption-relay.$sub.workers.dev"; fi
          fi
          if [ -n "$url" ]; then
            echo "RELAY_URL=$url" >> "$GITHUB_ENV"
            echo "::notice title=relay::중계 서버 $url"
          else
            echo "::notice title=relay::중계 서버 미설정 — 같은 와이파이 접속만 지원하는 패키지를 만듭니다"
          fi
      - run: npm run package:windows
      - name: Smoke test (unzip like a user, start, decode audio)
        run: node scripts/smoke-test-package.mjs release/caption-stream-windows.zip
      # 폴더째 올려야 받은 zip을 한 번만 풀면 START.bat이 바로 보인다 (zip을 올리면 이중 압축)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caption-stream-windows
          path: release/caption-stream/
          compression-level: 6
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} release/caption-stream-windows.zip --clobber
