# Windows 배포 패키지를 실제 Windows에서 만들고, 사용자처럼 압축을 풀어 켜서 확인한다.
# - 수동 실행/커밋: Actions 페이지의 Artifacts에서 caption-stream-windows 를 받는다
# - GitHub 웹에서 릴리스를 Publish하면: 그 릴리스에 caption-stream-windows.zip 을 붙인다
name: Windows package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -w server
      - run: npm run package:windows
      - name: Smoke test (unzip like a user, start, decode audio)
        run: node scripts/smoke-test-package.mjs release/caption-stream-windows.zip
      # 폴더째 올려야 받은 zip을 한 번만 풀면 START.bat이 바로 보인다 (zip을 올리면 이중 압축)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caption-stream-windows
          path: release/caption-stream/
          compression-level: 6
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} release/caption-stream-windows.zip --clobber
