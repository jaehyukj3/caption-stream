# Windows 배포 패키지를 실제 Windows에서 만들고 켜서 확인한다.
# v로 시작하는 태그를 올리면 zip을 GitHub Releases에 올린다.
name: Windows package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -w server
      - run: npm run package:windows
      - name: Smoke test (unzipped package)
        shell: pwsh
        run: |
          Expand-Archive release/caption-stream-windows.zip -DestinationPath smoke
          node scripts/smoke-test-package.mjs smoke/caption-stream
      - uses: actions/upload-artifact@v4
        with:
          name: caption-stream-windows
          path: release/caption-stream-windows.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} release/caption-stream-windows.zip --title "${{ github.ref_name }}" --notes "압축을 풀고 START.bat 을 더블클릭하세요. 자세한 내용은 zip 안의 사용법.txt"
