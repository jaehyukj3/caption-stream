# 웹 송출 사이트(중계 서버 + 화면) 배포.
# 노트북 프로그램(Windows zip)도 함께 만들어 올려, 사이트의 /download 에서 받을 수 있게 한다.
# 안드로이드 송출 앱(APK)도 만들어 /download/android 에서 받게 한다.
# 필요: 저장소 Secrets에 CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (README의 "중계 서버 설정")
name: Relay deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['relay/**', 'client/**', 'shared/**', 'server/**', 'scripts/**', 'android/**']

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare 설정 확인
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice title=relay::Cloudflare Secrets가 없어 배포를 건너뜁니다 (README의 '중계 서버 설정' 참고)"
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm ci
      - name: Resolve site URL
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).result.subdomain))")
          echo "RELAY_URL=https://caption-relay.$sub.workers.dev" >> "$GITHUB_ENV"
      # 노트북 프로그램: 화면 빌드까지 포함해 Windows용 zip을 만들고, 사이트에서 받을 수 있게 조각으로 나눈다
      - name: Build laptop package (Windows)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npm run package:windows
          node scripts/stage-download.mjs release/caption-stream-windows.zip client/dist/dl
      # 웹 송출 '기기 안 인식'용 음성인식 엔진(WebAssembly)과 모델(약 240MB, 20MB 조각)
      - name: Stage on-device speech engine
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node scripts/stage-web-stt.mjs client/dist/stt-web/engine
      # 안드로이드 송출 앱. 실패해도 사이트 배포는 계속한다 (앱만 이전 상태로 남음 → 아래 확인 단계에서 알림)
      - uses: actions/setup-java@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          gradle-version: 8.10.2
      - name: Build Android app
        id: android
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        continue-on-error: true
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: SITE_URL="$RELAY_URL" bash scripts/build-android.sh client/dist/app
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: relay
        run: npm ci && npx wrangler deploy
      - name: Check on-device engine
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$RELAY_URL/stt-web/engine/manifest.json" | grep -q '"version"'; then echo "engine ok"; exit 0; fi
            sleep 10
          done
          echo "::error::기기 안 인식 엔진 파일이 배포되지 않았습니다"; exit 1
      - name: Check Android app
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && steps.android.outcome == 'success'
        run: |
          expected=$(stat -c %s client/dist/app/caption-host.apk)
          for i in 1 2 3 4 5 6; do
            got=$(curl -sS "$RELAY_URL/download/android" -o check.apk -w '%{http_code} %{size_download}')
            [ "$got" = "200 $expected" ] && cmp -s check.apk client/dist/app/caption-host.apk && { echo "::notice title=android::$RELAY_URL/download/android"; exit 0; }
            sleep 10
          done
          head=$(curl -sSI "$RELAY_URL/download/android" | tr -d '\r' | tr '\n' ' ')
          echo "::error title=android::$RELAY_URL/download/android 내려받기 확인 실패 (받은 것: $got, 기대 크기 $expected) $head"; exit 1
      - name: Check download
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          expected=$(stat -c %s release/caption-stream-windows.zip)
          for i in 1 2 3 4 5 6; do
            got=$(curl -fsSI "$RELAY_URL/download" | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}')
            [ "$got" = "$expected" ] && break
            sleep 10
          done
          echo "download size: $got (expected $expected)"
          [ "$got" = "$expected" ] || { echo "::error title=download::$RELAY_URL/download 크기가 다릅니다"; exit 1; }
          curl -fsSL "$RELAY_URL/download" -o check.zip && unzip -tq check.zip
          echo "::notice title=download::$RELAY_URL/download"
      - name: Rebuild Windows package (verified on Windows)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run windows-package.yml --ref ${{ github.ref_name }}
      - name: Android build failed
        if: steps.android.outcome == 'failure'
        run: echo "::error title=android::안드로이드 앱 빌드 실패 (사이트는 배포됨)"; exit 1
