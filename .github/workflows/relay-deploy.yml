# 중계 서버(Cloudflare Workers) 배포 → 끝나면 그 주소가 들어간 Windows 패키지를 다시 만든다.
# 필요: 저장소 Secrets에 CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (README의 "중계 서버 설정")
name: Relay deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['relay/**', 'client/**', 'shared/**']

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare 설정 확인
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice title=relay::Cloudflare Secrets가 없어 중계 서버 배포를 건너뜁니다 (README의 '중계 서버 설정' 참고)"
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: 22
          cache: npm
      - name: Build viewer page
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm ci && npm run build
      - name: Deploy relay
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: relay
        run: npm ci && npx wrangler deploy
      - name: Rebuild Windows package with relay URL
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run windows-package.yml --ref ${{ github.ref_name }}
